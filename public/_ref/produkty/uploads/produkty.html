<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produkty — Ewa Wierzba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;
    --panel:#FFFFFF;
    --ink:#171512;
    --ink-soft:#544F45;
    --ink-faint:#8D8778;
    --accent:#D4291B;
    --line:#E3DCC9;
    --line-strong:#D0C6AC;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', sans-serif; font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}

  .topnav{position:sticky; top:0; z-index:50; background:rgba(250,247,241,0.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .topnav-inner{max-width:var(--maxw); margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px;}
  .topnav-brand{font-family:'Anton', sans-serif; font-size:18px;}
  .topnav-links{display:flex; gap:22px; flex-wrap:wrap; font-size:13px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
  .topnav-links a{color:var(--ink-soft); transition:color .15s;}
  .topnav-links a:hover{color:var(--accent);}
  .topnav-links a.is-current{color:var(--accent);}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:64px 24px; text-align:center;}
  .inner{max-width:520px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--accent); margin-bottom:18px;
  }
  h1{
    font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(36px, 7vw, 64px); line-height:1.0; margin:0 0 20px; letter-spacing:-0.01em;
  }
  h1 .accent-script{
    font-family:'Caveat', cursive; color:var(--accent); font-weight:700;
    text-transform:none; font-size:1.15em; display:inline-block; transform:rotate(-2deg);
  }
  p{color:var(--ink-soft); font-size:17px; margin:0 0 36px;}
  .cta-button{
    display:inline-block; background:var(--ink); color:var(--bg);
    padding:14px 28px; border-radius:40px; font-weight:600; font-size:14.5px;
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="topnav-brand">EWA WIERZBA</div>
    <div class="topnav-links">
      <a href="oferta.html">Oferta</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="blog.html">Blog</a>
      <a href="produkty.html" class="is-current">Produkty</a>
      <a href="kontakt.html">Kontakt</a>
    </div>
  </div>
</nav>

<main>
  <div class="inner">
    <div class="eyebrow">Produkty</div>
    <h1>Wkrótce <span class="accent-script">tutaj</span></h1>
    <p>Pracuję nad tym. Zajrzyj ponownie za jakiś czas — albo napisz, jeśli chcesz wiedzieć jako pierwsza/y, kiedy to wystartuje.</p>
    <a class="cta-button" href="kontakt.html">Napisz do mnie →</a>
  </div>
</main>

</body>
</html>
