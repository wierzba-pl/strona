<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt — Ewa Wierzba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;
    --panel:#FFFFFF;
    --ink:#171512;
    --ink-soft:#544F45;
    --ink-faint:#8D8778;
    --accent:#D4291B;
    --line:#E3DCC9;
    --line-strong:#D0C6AC;
    --radius:3px;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', sans-serif; font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- Nav ---------- */
  .topnav{
    position:sticky; top:0; z-index:50;
    background:rgba(250,247,241,0.94); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .topnav-inner{
    max-width:var(--maxw); margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .topnav-brand{font-family:'Anton', sans-serif; font-size:18px;}
  .topnav-links{display:flex; gap:22px; flex-wrap:wrap; font-size:13px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
  .topnav-links a{color:var(--ink-soft); transition:color .15s;}
  .topnav-links a:hover{color:var(--accent);}
  .topnav-links a.is-current{color:var(--accent);}

  /* ---------- Main ---------- */
  main{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding:64px 24px;
  }
  .contact-inner{
    max-width:640px;
    text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--accent); margin-bottom:18px;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.02;
    margin:0 0 20px;
    letter-spacing:-0.01em;
  }
  h1 .accent-script{
    font-family:'Caveat', cursive;
    color:var(--accent);
    font-weight:700;
    text-transform:none;
    font-size:1.15em;
    display:inline-block;
    transform:rotate(-2deg);
  }
  .contact-intro{
    color:var(--ink-soft);
    font-size:17px;
    max-width:48ch;
    margin:0 auto 48px;
  }

  .contact-options{
    display:flex; flex-direction:column; gap:14px;
    max-width:420px;
    margin:0 auto;
  }
  .contact-card{
    display:flex; align-items:center; gap:16px;
    padding:20px 24px;
    border-radius:var(--radius);
    border:1.5px solid var(--line-strong);
    background:var(--panel);
    text-align:left;
    transition:border-color .15s, transform .15s, background .15s;
  }
  .contact-card:hover{transform:translateY(-2px);}
  .contact-card--instagram{background:var(--ink); border-color:var(--ink); color:var(--bg);}
  .contact-card--instagram:hover{opacity:0.9;}
  .contact-card--gmail:hover{border-color:var(--accent);}

  .contact-icon{
    flex:0 0 auto;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .contact-card--gmail .contact-icon{background:#FBEBE8;}
  .contact-icon svg{width:20px; height:20px;}

  .contact-text-label{
    font-weight:700;
    font-size:15.5px;
    margin-bottom:2px;
  }
  .contact-text-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    opacity:0.75;
  }

  footer{
    text-align:center;
    padding:28px 24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-faint);
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="topnav-brand">EWA WIERZBA</div>
    <div class="topnav-links">
      <a href="oferta.html">Oferta</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="kalendarz.html">Kalendarz</a>
      <a href="regulamin.html">Regulamin</a>
      <a href="kontakt.html" class="is-current">Kontakt</a>
    </div>
  </div>
</nav>

<main>
  <div class="contact-inner">
    <div class="eyebrow">Kontakt</div>
    <h1>Napiszmy <span class="accent-script">się.</span></h1>
    <p class="contact-intro">Wybierz sposób, który jest Ci wygodniejszy — odpisuję na oba.</p>

    <div class="contact-options">
      <a class="contact-card contact-card--instagram" href="https://instagram.com/direct/t/EWA_WIERZBA_USERNAME" target="_blank" rel="noopener">
        <span class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
          </svg>
        </span>
        <span>
          <div class="contact-text-label">Napisz na Instagramie</div>
          <div class="contact-text-sub">Direct message</div>
        </span>
      </a>

      <a class="contact-card contact-card--gmail" href="mailto:ewawierzba.content@gmail.com">
        <span class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="var(--accent)" stroke-width="1.6"/>
            <path d="M4 6.5L12 13L20 6.5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>
          <div class="contact-text-label">Napisz e-mail</div>
          <div class="contact-text-sub">ewawierzba.content@gmail.com</div>
        </span>
      </a>
    </div>
  </div>
</main>

<footer>
  Zwykle odpowiadam w ciągu kilku dni roboczych.
</footer>

</body>
</html>
